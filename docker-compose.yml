services:
  db:
    image: ghcr.io/baosystems/postgis:17-3.5
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: historicalmap
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1 -d historicalmap"]
      interval: 3s
      retries: 20

  martin:
    image: ghcr.io/maplibre/martin:1.16.1
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/historicalmap
    ports: ["3100:3000"]
    depends_on:
      db: { condition: service_healthy }

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/historicalmap
    ports: ["3001:3001"]
    depends_on:
      db: { condition: service_healthy }

  osm2pgsql:
    image: iboates/osm2pgsql:2.3.1
    profiles: ["tools"]
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./data/ohm:/data
      - ./db:/db:ro
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
