<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>History of Europe on a map</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="map"></div>
    <div id="mode" role="group" aria-label="Mode">
      <button id="mode-year" type="button" aria-pressed="true">Year</button>
      <button id="mode-pin" type="button" aria-pressed="false">Pin</button>
    </div>
    <label class="regions-toggle" id="regions-wrap"><input id="regions" type="checkbox" /> Regions</label>
    <aside id="panel" hidden></aside>
    <nav class="legal-links" aria-label="Legal">
      <a href="/legal.html">Legal notice</a>
      <a href="/privacy.html">Privacy policy</a>
      <a href="https://github.com/mRudzki/historicalmap" target="_blank" rel="noopener noreferrer">GitHub</a>
    </nav>
    <footer id="controls">
      <label for="slider">Year:</label>
      <input id="slider" type="range" min="0" max="0" step="1" value="0" />
      <input id="year-input" type="number" aria-label="Year" step="1" />
      <strong id="year-label"></strong>
    </footer>
  </body>
</html>
