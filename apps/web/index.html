<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Historia Europy na mapie</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="map"></div>
    <div id="mode" role="group" aria-label="Tryb">
      <button id="mode-year" type="button" aria-pressed="true">Rok</button>
      <button id="mode-pin" type="button" aria-pressed="false">Pin</button>
    </div>
    <aside id="panel" hidden></aside>
    <footer id="controls">
      <label for="slider">Rok: <strong id="year-label"></strong></label>
      <input id="slider" type="range" min="0" max="0" step="1" value="0" />
    </footer>
  </body>
</html>
