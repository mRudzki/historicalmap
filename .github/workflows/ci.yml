name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: ghcr.io/baosystems/postgis:17-3.5
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: historicalmap }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w apps/web
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: scripts/e2e-setup.sh
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:run -w apps/web
