name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: ghcr.io/baosystems/postgis:17-3.5
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: historicalmap }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w apps/web
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: docker compose up -d --build --wait db martin api
      - run: DATA_DIR=db/fixtures npm run import
      - run: docker compose exec -T db psql -U postgres -d historicalmap < db/fixtures/ohm/staging.sql
      - run: OHM_SKIP_LOAD=1 npm run import:ohm
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        working-directory: apps/web
