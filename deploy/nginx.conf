# Inside the web container: static site + /api and /tiles proxied to the private services.
proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:10m max_size=300m inactive=7d use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # re-resolve container names, so a restarted api/martin does not need an nginx reload
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api    http://api:3001;
    set $martin http://martin:3000;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/geo+json application/javascript text/css image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_set_header Host $host;
    }

    # vector tiles only change when the data is reloaded, and every deploy recreates this cache
    location /tiles/ {
        rewrite ^/tiles/(.*)$ /$1 break;
        proxy_pass $martin;
        proxy_set_header Host $host;
        proxy_cache tiles;
        proxy_cache_valid 200 204 7d;
        proxy_cache_lock on;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Cache $upstream_cache_status;
    }

    # MapLibre's worker is a module worker: nginx's mime.types does not know .mjs, and the browser refuses
    # to run it as application/octet-stream (the map then stays empty). deploy/smoke-web.sh checks this.
    location /maplibre/ {
        default_type text/javascript;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
